<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>YouTube Downloader</h1>
        <div class="input-section">
            <input type="text" id="youtube-url" placeholder="Enter YouTube URL">
            <button id="get-info-btn">Get Video Info</button>
        </div>
        <div id="loader" class="hidden"></div>
        <div id="video-info" class="hidden">
            <h2 id="video-title"></h2>
            <img id="video-thumbnail" src="" alt="Video Thumbnail">
            <div id="download-options">
                <h3>Available Formats</h3>
                <table id="formats-table"></table>
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
